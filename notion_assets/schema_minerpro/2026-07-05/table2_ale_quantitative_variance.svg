<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><rect width="1400" height="720" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-weight:700;font-size:24px}.s{font-weight:700;font-size:20px}.t{font-size:17px}.small{font-size:14px}.line{stroke:#222;stroke-width:1.2}</style><text x="30" y="40" class="h">Table 2. Atomic layer etching quantitative schema variance</text><text x="30" y="72" class="small">Metrics: ROUGE-L / BLEU / BERT-F1. Values are pairwise schema similarity across LLM outputs.</text><line x1="30" y1="92" x2="1370" y2="92" class="line"/><text x="30" y="130" class="s">Stage 1</text><text x="180" y="130" class="t">GPT-4o vs GPT-4-turbo: 0.3758 / 0.3317 / 0.7764</text><text x="180" y="160" class="t">GPT-4o vs Llama-3.1-8B: 0.2732 / 0.1766 / 0.7497</text><text x="180" y="190" class="t">GPT-4-turbo vs Llama-3.1-8B: 0.3542 / 0.2705 / 0.7485</text><line x1="30" y1="220" x2="1370" y2="220" class="line"/><text x="30" y="260" class="s">Stage 2</text><text x="180" y="260" class="t">GPT-4o vs GPT-4-turbo: 0.3865 / 0.4612 / 0.7879</text><text x="180" y="290" class="t">GPT-4o vs Llama-3.1-8B: 0.2683 / 0.2123 / 0.7738</text><text x="180" y="320" class="t">GPT-4-turbo vs Llama-3.1-8B: 0.2838 / 0.2139 / 0.7524</text><line x1="30" y1="350" x2="1370" y2="350" class="line"/><text x="30" y="390" class="s">Stage 3</text><text x="180" y="390" class="t">GPT-4o vs GPT-4-turbo: 0.3552 / 0.3488 / 0.7631</text><text x="180" y="420" class="t">GPT-4o vs Llama-3.1-8B: 0.2793 / 0.2458 / 0.7370</text><text x="180" y="450" class="t">GPT-4-turbo vs Llama-3.1-8B: 0.3203 / 0.2693 / 0.7505</text><line x1="30" y1="485" x2="1370" y2="485" class="line"/><text x="30" y="530" class="s">Main reading</text><text x="180" y="530" class="t">GPT-4o and GPT-4-turbo are the most mutually consistent pair across ALE stages.</text><text x="180" y="562" class="t">Similarity drops in Stage 3 because the broader corpus injects more process variants and specialized terms.</text><text x="180" y="594" class="t">Llama-3.1-8B remains semantically plausible but less stable, especially against GPT-4o.</text><text x="30" y="660" class="small">ALE = atomic layer etching. This SVG is a compact redraw of the table values for Notion display.</text></svg>