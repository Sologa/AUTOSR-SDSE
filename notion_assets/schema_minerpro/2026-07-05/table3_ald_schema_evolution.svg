<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><rect width="1400" height="700" fill="white"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-weight:700;font-size:24px}.head{font-weight:700;font-size:19px}.stage{font-weight:700;font-size:18px}.cell{font-size:16px}.small{font-size:14px}.line{stroke:#222;stroke-width:1.2}</style><text x="30" y="40" class="h">Table 3. ALD schema evolution across stages</text><line x1="30" y1="70" x2="1370" y2="70" class="line"/><text x="40" y="105" class="head">Stage</text><text x="210" y="105" class="head">Extracted properties</text><text x="850" y="105" class="head">Expert feedback</text><line x1="30" y1="125" x2="1370" y2="125" class="line"/><text x="40" y="160" class="stage">Stage-1</text><text x="210" y="155" class="cell">Reactants; process conditions; film properties;</text><text x="210" y="180" class="cell">safety and stability.</text><text x="850" y="155" class="cell">Missing ALD method, deposited material, carrier gas,</text><text x="850" y="180" class="cell">bubbler temperature, reactor, substrate, nucleation</text><text x="850" y="205" class="cell">period, crystallinity, and film density.</text><line x1="30" y1="235" x2="1370" y2="235" class="line"/><text x="40" y="270" class="stage">Stage-2</text><text x="210" y="265" class="cell">Adds ALD method, deposited material, carrier gas,</text><text x="210" y="290" class="cell">bubbler temperature, reactor, substrate, nucleation</text><text x="210" y="315" class="cell">period, crystallinity, density, optical/electrical</text><text x="210" y="340" class="cell">properties, safety and stability.</text><text x="850" y="265" class="cell">Merge growth per cycle, nucleation period, and</text><text x="850" y="290" class="cell">self-limiting growth into one growth-behavior</text><text x="850" y="315" class="cell">information unit.</text><line x1="30" y1="375" x2="1370" y2="375" class="line"/><text x="40" y="410" class="stage">Stage-3</text><text x="210" y="405" class="cell">Keeps ALD method, material, reactants, process</text><text x="210" y="430" class="cell">conditions; restructures growth per cycle and</text><text x="210" y="455" class="cell">nucleation period under growth behavior; adds</text><text x="210" y="480" class="cell">diffusion-barrier properties.</text><text x="850" y="405" class="cell">None needed.</text><line x1="30" y1="515" x2="1370" y2="515" class="line"/><text x="40" y="560" class="head">Main reading</text><text x="210" y="560" class="cell">Expert feedback is not merely cosmetic: it changes the ontology of the schema.</text><text x="210" y="590" class="cell">The pipeline first adds missing domain concepts, then merges scattered properties into stable higher-level units.</text><text x="30" y="660" class="small">This SVG is a compact redraw of the original table for Notion display.</text></svg>